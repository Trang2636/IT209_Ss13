services:
  mysql:
    image: mysql:8.4
    container_name: campus-hub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:campus_hub}
      TZ: Asia/Ho_Chi_Minh
    networks:
      - campus-net
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: campus-hub-backend
    container_name: campus-hub-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:

      DB_URL: "jdbc:mysql://mysql:3306/campus_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia%2FHo_Chi_Minh"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:1234}
      SERVER_PORT: "8080"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - campus-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  campus-net:
    driver: bridge

volumes:
  mysql-data:
